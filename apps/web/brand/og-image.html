<!doctype html>
<!-- Source of public/og-image.png (1200×630). Regenerate with any headless Chrome:
     chrome --headless --window-size=1200,630 --screenshot=../public/og-image.png og-image.html --><html><head><style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#0a0d12;color:#eef1f5;font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,#262d38 1px,transparent 1px),linear-gradient(to bottom,#262d38 1px,transparent 1px);background-size:56px 56px;opacity:.45;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 15%,transparent 70%)}
.glow{position:absolute;left:50%;top:-260px;width:1100px;height:700px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(52,211,153,.24),transparent)}
.glow2{position:absolute;right:-180px;bottom:-200px;width:620px;height:520px;background:radial-gradient(closest-side,rgba(56,189,248,.12),transparent)}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:120px;height:120px;filter:drop-shadow(0 18px 40px rgba(16,185,129,.35))}
.pill{margin-top:30px;display:inline-flex;align-items:center;gap:10px;border:1px solid #262d38;background:rgba(18,22,29,.7);border-radius:999px;padding:8px 18px 8px 10px;font-size:20px;color:#8b95a4}
.pill b{display:inline-flex;align-items:center;gap:8px;background:rgba(52,211,153,.15);color:#34d399;border-radius:999px;padding:4px 12px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#34d399}
h1{margin:24px 0 0;font-size:78px;line-height:1;letter-spacing:-.035em;font-weight:650}
h1 span{color:#34d399}
p{margin:22px 0 0;font-size:30px;color:#a3adbb;letter-spacing:-.01em}
footer{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:20px;color:#5d6673;letter-spacing:.01em}
</style></head><body>
<div class="glow"></div><div class="glow2"></div><div class="grid"></div>
<main>
  <img src="../public/logo.svg" alt="">
  <div class="pill"><b><span class="dot"></span>Live in Spain</b>Open source · MIT</div>
  <h1>Find a <span>free spot</span><br>before you get there.</h1>
  <p>FreePark watches public street cameras and marks free curb space in green.</p>
</main>
<footer>getfreepark.com · open source on GitHub</footer>
</body></html>
